{% extends "base.html" %}
{% block title %}Print card · LifeCard{% endblock %}
{% block content %}
<img class="cardimg" style="max-width:640px;margin:0 auto" src="{{ url_for('card_png') }}?r={{ bust }}" alt="Your LifeCard">

<a class="btn ghost" href="{{ url_for('patient_home') }}">Back</a></div>
{% endblock %}
