{#- Inline SVG icon set. Stroke uses currentColor so icons inherit text colour. -#}
{% macro icon(name, size=20, stroke=2) -%}
<svg class="ico ico--{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'scan' -%}
<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/>
{%- elif name == 'qr' -%}
<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/>
{%- elif name == 'nfc' -%}
<path d="M6 8a8 8 0 0 1 0 8M10 6a12 12 0 0 1 0 12M14 4a16 16 0 0 1 0 16"/>
{%- elif name == 'hospital' -%}
<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M12 9v6M9 12h6"/>
{%- elif name == 'unlock' -%}
<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>
{%- elif name == 'lock' -%}
<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'message' -%}
<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>
{%- elif name == 'note' -%}
<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
{%- elif name == 'pin' -%}
<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
{%- elif name == 'phone' -%}
<path d="M5 3h3.5l1.8 4.4-2.2 1.6a12 12 0 0 0 6 6l1.6-2.2 4.4 1.8V18a3 3 0 0 1-3 3A16 16 0 0 1 3 6a3 3 0 0 1 2-3z"/>
{%- elif name == 'home' -%}
<path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20z"/><path d="M9.5 21v-6h5v6"/>
{%- elif name == 'heart' -%}
<path d="M12 20.5 4.4 13A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 7.6 6z"/>
{%- elif name == 'pulse' -%}
<path d="M2 12h4l2.5-7 4 14L15.5 12H22"/>
{%- elif name == 'drop' -%}
<path d="M12 3s6 6.3 6 10.2A6 6 0 0 1 6 13.2C6 9.3 12 3 12 3z"/>
{%- elif name == 'scale' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 12 8.5 8.5"/>
{%- elif name == 'shield' -%}
<path d="M12 3 4 6v6c0 5 3.4 8.2 8 9.5 4.6-1.3 8-4.5 8-9.5V6z"/><path d="m9.3 12.2 1.9 1.9 3.6-3.6"/>
{%- elif name == 'alert' -%}
<path d="M12 3.5 1.8 20.2h20.4z"/><path d="M12 10v4.5M12 17.8v.2"/>
{%- elif name == 'check' -%}
<path d="m4.5 12.5 5 5 10-11"/>
{%- elif name == 'x' -%}
<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'arrow' -%}
<path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/>
{%- elif name == 'globe' -%}
<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
{%- elif name == 'users' -%}
<circle cx="9" cy="8" r="3.4"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.4 3.4 0 0 1 0 5.6M17.5 14.3A6.5 6.5 0 0 1 21.5 20"/>
{%- elif name == 'camera' -%}
<path d="M3 8.5A2 2 0 0 1 5 6.5h2L8.5 4h7L17 6.5h2a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/>
{%- elif name == 'download' -%}
<path d="M12 3v12M7.5 11 12 15.5 16.5 11"/><path d="M4 20h16"/>
{%- elif name == 'refresh' -%}
<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 3v5h-5"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/>
{%- elif name == 'pill' -%}
<rect x="2.6" y="8.6" width="18.8" height="6.8" rx="3.4" transform="rotate(-45 12 12)"/><path d="M8.5 8.5 15.5 15.5"/>
{%- elif name == 'chart' -%}
<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'plus' -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == 'sparkle' -%}
<path d="M12 3.5 13.9 9l5.6 1.9L13.9 13 12 18.5 10.1 13 4.5 10.9 10.1 9z"/>
{%- elif name == 'ambulance' -%}
<path d="M2 17V8.5A1.5 1.5 0 0 1 3.5 7h9.8v10"/><path d="M13.3 10h3.5L21 13.4V17"/><circle cx="7" cy="17.6" r="2"/><circle cx="17.5" cy="17.6" r="2"/><path d="M7 9.5v3M5.5 11h3"/>
{%- elif name == 'settings' -%}
<circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.2 1.6z"/>
{%- elif name == 'eye' -%}
<path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'map' -%}
<path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5v-14L15 6.5z"/><path d="M9 4v14M15 6.5v14"/>
{%- elif name == 'dot' -%}
<circle cx="12" cy="12" r="4"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}
