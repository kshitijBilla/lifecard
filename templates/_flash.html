{%- with messages = get_flashed_messages(with_categories=true) -%}
  {%- if messages -%}
  <div class="flashes">
    {%- for category, message in messages -%}
    <div class="flash flash--{{ 'ok' if category == 'ok' else ('error' if category == 'error' else 'info') }}">
      <span>{{ message }}</span>
      <button class="flash__x" type="button" data-dismiss aria-label="Dismiss">&times;</button>
    </div>
    {%- endfor -%}
  </div>
  {%- endif -%}
{%- endwith -%}
